<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des Achats — ARG</title>
<style>
/* ===== Palette & tokens ===== Layout: fixed sidebar nav + scrollable main; cards & sortable tables */
:root{
  /* Palette douce, faible fatigue : fonds sans blanc cru, accent teal calme, texte gris-ardoise */
  --accent:#2a7d74; --accent-2:#20625b; --accent-soft:#dde9e6;
  --bg:#eceee9; --panel:#f6f7f3; --panel-2:#eef0ea;
  --fg:#2b322f; --muted:#6a736e; --line:#dce0d9;
  --ok:#3a8a5c; --ok-soft:#e1efe6;
  --warn:#a87a2b; --warn-soft:#f4ecda;
  --crit:#bd5349; --crit-soft:#f3e2df;
  --info:#3f6fa3; --info-soft:#e3eaf2;
  --shadow:0 1px 2px rgba(30,45,40,.05),0 2px 8px rgba(30,45,40,.04);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#4fb3aa; --accent-2:#63c7be; --accent-soft:#183531;
  --bg:#171c1a; --panel:#1e2522; --panel-2:#232b28;
  --fg:#dce2de; --muted:#93a099; --line:#2d3732;
  --ok:#5cbd82; --ok-soft:#163528; --warn:#d6ae5c; --warn-soft:#352b14;
  --crit:#e07a6d; --crit-soft:#36201c; --info:#6fa2d6; --info-soft:#17293c;
  --shadow:0 1px 2px rgba(0,0,0,.28),0 2px 12px rgba(0,0,0,.22);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --accent:#4fb3aa; --accent-2:#63c7be; --accent-soft:#183531;
  --bg:#171c1a; --panel:#1e2522; --panel-2:#232b28;
  --fg:#dce2de; --muted:#93a099; --line:#2d3732;
  --ok:#5cbd82; --ok-soft:#163528; --warn:#d6ae5c; --warn-soft:#352b14;
  --crit:#e07a6d; --crit-soft:#36201c; --info:#6fa2d6; --info-soft:#17293c;
  --shadow:0 1px 2px rgba(0,0,0,.28),0 2px 12px rgba(0,0,0,.22);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;background:var(--bg);color:var(--fg)}
h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
a{color:var(--accent)}
button{font-family:inherit}
.tabnum{font-variant-numeric:tabular-nums}

/* layout */
.app{display:flex;min-height:100%}
.side{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand b{font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--panel-2)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ico{width:17px;text-align:center;opacity:.8}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 6px;font-weight:700}
.side .foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:17px}
.content{padding:18px 20px 60px;max-width:1280px;width:100%}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.grow{flex:1}

/* inputs */
input,select,textarea{font-family:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:58px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.fld span{font-weight:600;letter-spacing:.2px}
.search{max-width:280px;position:relative}
.search input{padding-left:30px}
.search::before{content:"⌕";position:absolute;left:10px;top:7px;color:var(--muted);font-size:15px}

/* cards & grid */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:16px}
.kpi{padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi.alert{border-left:3px solid var(--warn)}
.kpi.crit{border-left:3px solid var(--crit)}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:9px 11px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th .ar{opacity:.4;font-size:10px;margin-left:3px}
thead th.sorted .ar{opacity:1;color:var(--accent)}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mut{background:var(--panel-2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* stepper */
.stepper{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.step{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step.cur{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,19,.5);display:none;align-items:flex-start;justify-content:center;z-index:30;padding:24px;overflow:auto}
.scrim.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);width:100%;max-width:860px;margin:auto}
.modal .mh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:14px 14px 0 0;z-index:2}
.modal .mh h3{font-size:16px}
.modal .mb{padding:18px}
.xbtn{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}

/* section accordion inside dossier */
.sect{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sect>summary{list-style:none;cursor:pointer;padding:11px 14px;background:var(--panel-2);font-weight:600;display:flex;align-items:center;gap:9px}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.sect[open]>summary .chev{transform:rotate(90deg)}
.sect .body{padding:14px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}

.sectionhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sectionhead h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sectionhead .line{flex:1;height:1px;background:var(--line)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

.hint{font-size:12px;color:var(--muted)}
.seedbanner{background:var(--info-soft);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:9px;padding:8px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;margin-bottom:14px}

@media (max-width:760px){
  .app{flex-direction:column}
  .side{position:static;width:100%;height:auto;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .side .foot{margin-top:0}
}
/* ship tracker */
.searoute{width:100%;height:auto;display:block;overflow:visible;margin-top:2px}
.sea-band{fill:var(--accent);opacity:.07}
.route-todo{stroke:var(--line);stroke-width:2;stroke-dasharray:3 8;stroke-linecap:round}
.route-done{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.port-dot{fill:var(--muted)}
.port-dot.arr{fill:var(--accent)}
.port-lbl{fill:var(--muted);font-size:14px;font-weight:600}
.port-sub{fill:var(--muted);opacity:.7;font-size:11px}
.ship-hull{fill:var(--accent)}
.ship-sail{fill:var(--accent-2)}
.ship-mast{stroke:var(--accent-2);stroke-width:2}
.wave{stroke:var(--accent);opacity:.3;stroke-width:1.5;fill:none}
.shipPos{transform:translateX(var(--xt))}
@media (prefers-reduced-motion:no-preference){
  .shipPos{animation:sail 2.6s cubic-bezier(.33,.08,.2,1) both}
  .shipBob{animation:bob 3.4s ease-in-out infinite}
  .wave{stroke-dasharray:7 11;animation:flow 2.6s linear infinite}
}
@keyframes sail{from{transform:translateX(var(--x0))}to{transform:translateX(var(--xt))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@media print{
  .side,.topbar,.btn,.search,.nav,.no-print{display:none!important}
  .content{padding:0;max-width:none}
  .tablewrap{border:0}
  thead th{position:static}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>Achats · ARG</b><small>AL RAJA GROUP</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="btn sm ghost" id="themeBtn" title="Thème clair/sombre">◐ Thème</button>
      <button class="btn sm ghost" id="helpBtn" title="Aide">?</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="viewTitle">Tableau de bord</h2>
      <div class="grow"></div>
      <div id="topActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Gestion des Achats — ARG   (application locale autonome)
   Données stockées dans le navigateur (localStorage).
   Pensez à "Sauvegarde" régulièrement (export JSON).
   ============================================================ */

const STAGES = ["Prospection","Cotation envoyée","Relance","Offres reçues","Comparaison","Négociation","Fournisseur sélectionné","Acompte versé","LC en cours","Production","Expédition","Réception","Clôturé"];
const CURRENCIES = ["USD","EUR","MRU","CNY","AED","GBP"];
const STATES = ["Actif","Clôturé","Classé sans suite"];
const COUNTRIES = ["Afrique du Sud","Algérie","Allemagne","Arabie saoudite","Autriche","Bangladesh","Belgique","Bénin","Brésil","Burkina Faso","Cameroun","Canada","Chine","Corée du Sud","Côte d'Ivoire","Danemark","Égypte","Émirats arabes unis","Espagne","États-Unis","Éthiopie","Finlande","France","Gambie","Ghana","Grèce","Guinée","Hong Kong","Inde","Indonésie","Irlande","Italie","Japon","Jordanie","Kenya","Koweït","Liban","Libye","Malaisie","Mali","Maroc","Mauritanie","Niger","Nigéria","Norvège","Oman","Pakistan","Pays-Bas","Pologne","Portugal","Qatar","Roumanie","Royaume-Uni","Russie","Sénégal","Singapour","Suède","Suisse","Taïwan","Tchéquie","Thaïlande","Togo","Tunisie","Turquie","Ukraine","Vietnam","Autre"];
const INCOTERMS = ["EXW","FCA","FAS","FOB","CFR","CIF","CPT","CIP","DAP","DPU","DDP"];
const ENTITIES = ["AL RAJA GROUP","RIMATEL","CDI","BIS-TP","BISHTP","SMART","CDE","BIS ROUTES","AFRIPLAST","ITIGHANE","Autre"];
const KEY="arg_achats_db_v1";
const uid=()=> (Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const todayISO=()=> new Date().toISOString().slice(0,10);
const esc=s=> (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney=(n,c)=> (n==null||n===""||isNaN(n))?"—":Number(n).toLocaleString("fr-FR",{maximumFractionDigits:2})+(c?(" "+c):"");
const fmtNum=n=> (n==null||n===""||isNaN(n))?"—":Number(n).toLocaleString("fr-FR");
const daysBetween=(a,b)=> Math.round((new Date(b)-new Date(a))/86400000);

/* ---------- persistence ---------- */
let DB=load();
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r); if(d&&d.dossiers)return d;}}catch(e){}
  return seed();
}
function save(){ DB.meta=DB.meta||{}; DB.meta.updatedAt=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast("⚠ Sauvegarde navigateur impossible — exportez vos données");} syncAutoPush(); }

/* ---------- pièces jointes réelles (fichiers) : stockage local IndexedDB ----------
   Les fichiers (devis signés, SWIFT, BL…) sont volumineux : on les garde dans
   IndexedDB (plusieurs centaines de Mo possibles) et non dans localStorage (~5 Mo).
   Seules les métadonnées (nom, type, taille, fileId) vivent dans la base synchronisée. */
const FILES_DB="arg_files_v1",FILES_STORE="files";
let _fdb=null;
function filesDB(){return new Promise((res,rej)=>{if(_fdb)return res(_fdb);try{const rq=indexedDB.open(FILES_DB,1);rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(FILES_STORE))db.createObjectStore(FILES_STORE,{keyPath:"id"});};rq.onsuccess=()=>{_fdb=rq.result;res(_fdb);};rq.onerror=()=>rej(rq.error);}catch(e){rej(e);}});}
async function filePut(rec){const db=await filesDB();return new Promise((res,rej)=>{const tx=db.transaction(FILES_STORE,"readwrite");tx.objectStore(FILES_STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function fileGet(id){try{const db=await filesDB();return await new Promise((res,rej)=>{const tx=db.transaction(FILES_STORE,"readonly");const rq=tx.objectStore(FILES_STORE).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}catch(e){return null;}}
async function fileDel(id){if(!id)return;try{const db=await filesDB();await new Promise(res=>{const tx=db.transaction(FILES_STORE,"readwrite");tx.objectStore(FILES_STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}catch(e){}}
function fileSizeTxt(n){if(n==null)return"";if(n<1024)return n+" o";if(n<1048576)return(n/1024).toFixed(0)+" Ko";return(n/1048576).toFixed(1)+" Mo";}
// Récupère le blob : d'abord IndexedDB local, sinon télécharge depuis Supabase Storage et met en cache
async function fileEnsureLocal(doc){
  const rec=await fileGet(doc.fileId);if(rec&&rec.blob)return rec.blob;
  if(doc.storagePath&&typeof stgDownload==="function"&&syncConfigured()){
    try{toast("Téléchargement du fichier depuis le cloud…");const blob=await stgDownload(doc.storagePath);if(doc.fileId)await filePut({id:doc.fileId,blob:blob,name:doc.fileName,type:doc.fileType});return blob;}catch(e){}
  }
  return null;
}
async function fileView(doc){const blob=await fileEnsureLocal(doc);if(!blob){toast("⚠ Fichier introuvable (ni sur l'appareil, ni dans le cloud)");return;}const url=URL.createObjectURL(blob);const w=window.open(url,"_blank","noopener");if(!w){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.append(a);a.click();a.remove();}setTimeout(()=>URL.revokeObjectURL(url),120000);}
async function fileDownload(doc){const blob=await fileEnsureLocal(doc);if(!blob){toast("⚠ Fichier introuvable");return;}const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=doc.fileName||doc.name||"document";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);}
async function fileShare(doc){const blob=await fileEnsureLocal(doc);if(!blob){toast("⚠ Fichier introuvable");return;}const f=new File([blob],doc.fileName||doc.name||"document",{type:blob.type||doc.fileType||"application/octet-stream"});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:doc.name||doc.fileName||"Document"});return;}}catch(e){if(e&&e.name==="AbortError")return;}toast("Partage direct indisponible sur cet appareil — téléchargement à la place");fileDownload(doc);}

/* ---------- synchronisation cloud (Supabase, mono-utilisateur) ---------- */
const SYNC={urlK:"arg_sync_url",keyK:"arg_sync_key",codeK:"arg_sync_code",autoK:"arg_sync_auto",atK:"arg_sync_at"};
function syncCfg(){try{return {url:localStorage.getItem(SYNC.urlK)||"",key:localStorage.getItem(SYNC.keyK)||"",code:localStorage.getItem(SYNC.codeK)||"",auto:localStorage.getItem(SYNC.autoK)==="1"};}catch(e){return {url:"",key:"",code:"",auto:false};}}
function syncConfigured(){const c=syncCfg();return !!(c.url&&c.key&&c.code);}
function syncHeaders(c){return {"apikey":c.key,"Authorization":"Bearer "+c.key,"Content-Type":"application/json"};}
function syncEndpoint(c){return c.url.replace(/\/+$/,"")+"/rest/v1/arg_sync";}
let syncBusy=false,syncTimer=null,lastSyncMsg="";
function setSyncMsg(m){lastSyncMsg=m;const el2=document.getElementById("syncStatus");if(el2)el2.textContent=m;}
async function syncPush(silent){
  const c=syncCfg();if(!syncConfigured()){if(!silent)toast("Configurez la synchro d'abord");return;}
  syncBusy=true;setSyncMsg("Envoi en cours…");
  try{
    DB.meta=DB.meta||{};DB.meta.updatedAt=DB.meta.updatedAt||Date.now();
    const body=[{code:c.code,data:DB,updated_at:new Date(DB.meta.updatedAt).toISOString()}];
    const r=await fetch(syncEndpoint(c),{method:"POST",headers:Object.assign(syncHeaders(c),{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    try{localStorage.setItem(SYNC.atK,String(DB.meta.updatedAt));}catch(e){}
    setSyncMsg("Synchronisé ✓ "+new Date().toLocaleTimeString("fr-FR"));if(!silent)toast("Données envoyées vers le cloud");
  }catch(e){setSyncMsg("⚠ Échec de l'envoi");if(!silent)toast("⚠ Échec synchro : "+e.message);}
  syncBusy=false;
}
async function syncPull(opts){
  opts=opts||{};const c=syncCfg();if(!syncConfigured()){if(!opts.silent)toast("Configurez la synchro d'abord");return;}
  setSyncMsg("Récupération…");
  try{
    const r=await fetch(syncEndpoint(c)+"?code=eq."+encodeURIComponent(c.code)+"&select=data,updated_at",{headers:syncHeaders(c)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const rows=await r.json();
    if(!rows.length){setSyncMsg("Rien dans le cloud encore");if(!opts.silent)toast("Aucune donnée dans le cloud — envoyez d'abord");return;}
    const cloud=rows[0].data;const cloudAt=cloud&&cloud.meta&&cloud.meta.updatedAt?cloud.meta.updatedAt:Date.parse(rows[0].updated_at)||0;
    const localAt=(DB.meta&&DB.meta.updatedAt)||0;
    if(opts.auto){
      if(cloudAt>localAt){DB=cloud;try{localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(SYNC.atK,String(cloudAt));}catch(e){}setSyncMsg("À jour depuis le cloud ✓");buildNav();applyBrandLogo();render();toast("Données à jour (cloud plus récent)");}
      else{setSyncMsg("Déjà à jour ✓");}
      return;
    }
    const doLoad=()=>{DB=cloud;try{localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(SYNC.atK,String(cloudAt));}catch(e){}setSyncMsg("Récupéré ✓");buildNav();applyBrandLogo();render();toast("Données récupérées du cloud");};
    if(cloudAt<localAt){confirmBox("⚠ La version locale semble PLUS RÉCENTE que le cloud ("+new Date(localAt).toLocaleString("fr-FR")+" vs "+new Date(cloudAt).toLocaleString("fr-FR")+"). Récupérer écrasera vos modifications locales. Continuer ?",doLoad,"Récupérer quand même");}
    else doLoad();
  }catch(e){setSyncMsg("⚠ Échec de la récupération");if(!opts.silent)toast("⚠ Échec synchro : "+e.message);}
}

/* alerts */
function alerts(){
  const t=todayISO();const out={lcSoon:[],rfqDue:[],toCompare:[],enRoute:[]};
  DB.dossiers.forEach(d=>{
    if(getState(d)!=="Actif")return;
    if(d.lcExpiryDate && stageIdx(d.stage)<11){const dd=daysBetween(t,d.lcExpiryDate); if(dd<=30) out.lcSoon.push({d,dd});}
    if(d.stage==="Cotation envoyée" && d.rfqDueDate && daysBetween(t,d.rfqDueDate)<=0) out.rfqDue.push(d);
    if(d.stage==="Offres reçues"||d.stage==="Comparaison") out.toCompare.push(d);
    if(d.stage==="Expédition") out.enRoute.push(d);
  });
  return out;
}

/* ============================================================
   ASSISTANT — POINT DU JOUR (moteur de tâches)
   ============================================================ */
function dossTasks(d){
  const t=todayISO(),out=[],sup=dossSup(d),si=stageIdx(d.stage);
  const push=(type,prio,txt)=>out.push({id:d.id,ref:d.ref,sup:sup,entity:dossEntity(d),key:d.id+":"+type,prio,txt});
  if(d.stage==="Cotation envoyée"||d.stage==="Relance"){
    const waiting=(d.offers||[]).filter(o=>o.price==null||o.price==="");
    const due=(d.rfqDueDate&&daysBetween(t,d.rfqDueDate)<=0)||(d.rfqSentDate&&daysBetween(d.rfqSentDate,t)>=5);
    if(waiting.length&&due){const names=waiting.map(o=>supName(o.supplierId)).filter(x=>x&&x!=="—").join(", ")||sup;push("relance","warn","Relancer "+names+" pour obtenir le devis"+(d.rfqSentDate?" (RFQ du "+d.rfqSentDate+")":""));}
  }
  if((d.stage==="Offres reçues"||d.stage==="Comparaison")&&!d.selectedSupplierId){const priced=(d.offers||[]).filter(o=>o.price);if(priced.length)push("comparer","info","Comparer les offres et sélectionner le fournisseur ("+priced.length+" reçue(s))");}
  if(d.stage==="Négociation")push("negocier","info","Finaliser la négociation avec "+sup);
  if(d.depositAmount&&!d.depositDate&&si>=stageIdx("Fournisseur sélectionné"))push("acompte","warn","Régler l'acompte "+fmtMoney(d.depositAmount,d.currency)+" à "+sup);
  const usesLC=d.balanceInstrument==="Lettre de crédit"||d.depositInstrument==="Lettre de crédit"||d.lcAmount;
  if(usesLC&&!d.lcOpeningDate&&d.selectedSupplierId)push("ouvrirlc","crit","Ouvrir / suivre la LC"+(d.lcBank?" ("+d.lcBank+")":"")+" — "+sup);
  if(d.lcExpiryDate&&si<stageIdx("Réception")){const dd=daysBetween(t,d.lcExpiryDate);if(dd<0)push("lcexp","crit","LC EXPIRÉE ("+d.lcExpiryDate+") — "+sup+" : régulariser d'urgence");else if(dd<=30)push("lcexp","crit","LC expire dans "+dd+" j ("+d.lcExpiryDate+") — "+sup);}
  if(d.prodStart&&daysBetween(t,d.prodStart)<=0&&(!d.prodStatus||d.prodStatus==="Non démarrée"))push("prodstart","warn","Vérifier si la production a démarré chez "+sup);
  if(d.prodEnd&&daysBetween(t,d.prodEnd)<0&&d.prodStatus!=="Terminée")push("prodretard","crit","Production en retard (fin prévue "+d.prodEnd+") — relancer "+sup);
  if(d.balanceAmount&&!d.balanceDate&&si>=stageIdx("Production"))push("reliquat","warn","Régler le reliquat "+fmtMoney(d.balanceAmount,d.currency)+" — "+sup);
  const shipped=d.etd||["Chargé","En transit","Arrivé","Dédouané","Livré"].includes(d.shipStatus);
  if(d.latestShipDate&&!shipped){const dd=daysBetween(t,d.latestShipDate);if(dd<0)push("latestship","crit","Date limite d'expédition LC DÉPASSÉE ("+d.latestShipDate+") — "+sup+" : risque de péremption de la LC");else if(dd<=21)push("latestship","crit","Expédier avant le "+d.latestShipDate+" (date limite LC, J−"+dd+") — "+sup);}
  if(d.eta){const dd=daysBetween(t,d.eta),arr=["Arrivé","Dédouané","Livré"].includes(d.shipStatus);
    if(dd<0&&!arr&&!d.receivedDate)push("etadep","crit","ETA dépassée ("+d.eta+") — vérifier l'arrivée à "+(d.pod||"destination"));
    else if(dd>=0&&dd<=7&&!arr)push("navire","info","Navire arrive le "+d.eta+" à "+(d.pod||"destination")+" — préparer la réception");}
  if((["Arrivé","Dédouané"].includes(d.shipStatus)||(d.eta&&daysBetween(t,d.eta)<0))&&!d.receivedDate&&si>=stageIdx("Expédition"))push("reception","warn","Réceptionner la commande et contrôler la conformité — "+sup);
  if(d.receivedDate&&!d.conformity)push("conformite","info","Saisir le contrôle de conformité — "+sup);
  return out;
}
function todayTasks(){
  const t=todayISO();let tasks=[];
  DB.dossiers.filter(d=>getState(d)==="Actif").forEach(d=>{tasks=tasks.concat(dossTasks(d));});
  const ord={crit:0,warn:1,info:2};tasks.sort((a,b)=>ord[a.prio]-ord[b.prio]);
  const done=(DB.meta&&DB.meta.done&&DB.meta.done[t])||{};
  return {pending:tasks.filter(x=>!done[x.key]),finished:tasks.filter(x=>done[x.key]),all:tasks};
}

/* ---------- ship tracker (visuel dynamique) ---------- */
function shipProgress(d){
  const t=todayISO();
  if(d.etd&&d.eta){const tot=daysBetween(d.etd,d.eta);if(tot>0){const p=daysBetween(d.etd,t)/tot;return Math.max(0.02,Math.min(1,p));}}
  const map={"Réservé":0.04,"Chargé":0.1,"En transit":0.5,"Arrivé":0.95,"Dédouané":0.99,"Livré":1};
  return map[d.shipStatus]!=null?map[d.shipStatus]:0.5;
}
function renderShipTracks(){
  const ships=DB.dossiers.filter(d=>getState(d)==="Actif"&&(d.shipStatus||(d.etd&&d.eta)||d.eta));
  ships.sort((a,b)=>String(a.eta||"9999").localeCompare(String(b.eta||"9999")));
  const card=el("div",{class:"card pad"});
  if(!ships.length){card.append(el("div",{class:"hint"},"Aucun navire en mer actuellement. Renseignez l'ETD, l'ETA et le statut dans la section « Expédition & tracking » d'un dossier — le navire apparaîtra ici et progressera tout seul selon les dates."));return card;}
  const wrap=el("div",{style:"display:flex;flex-direction:column;gap:18px"});
  ships.forEach(d=>wrap.append(shipTrack(d)));
  card.append(wrap);return card;
}

  const dte=d.eta?daysBetween(todayISO(),d.eta):null;

  const pol=esc(d.pol||"Départ");const pod=esc(d.pod||"Nouakchott");
  let badge;
  if(arrived)badge=`<span class="pill ok">● ${esc(d.shipStatus||"Arrivé")}</span>`;

function backupJSON(){download(JSON.stringify(DB,null,2),`sauvegarde-achats-ARG-${todayISO()}.json`,"application/json");toast("Sauvegarde exportée");}
function restoreJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.dossiers)throw 0;DB=d;save();go("dash");toast("Sauvegarde restaurée");}catch(x){toast("⚠ Fichier invalide");}};r.readAsText(f);}
function importDossierFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importMerge(JSON.parse(r.result));}catch(x){toast("⚠ Fichier JSON invalide");}};r.readAsText(f);e.target.value="";}
function pasteImport(){
  const m=$("#modal");m.innerHTML="";
  m.append(el("div",{class:"mh"},el("h3",{},"Mettre à jour depuis Claude"),el("div",{class:"grow"}),el("button",{class:"xbtn",onclick:closeModal},"×")));

  b.append(el("p",{class:"hint",style:"margin:0 0 10px"},"Collez ici le bloc JSON que Claude vous a préparé (fournisseurs, dossiers ou tâches), puis « Mettre à jour ». Fusion sans doublon — rien d'existant n'est écrasé. Si la synchro cloud est active, la mise à jour se propage à vos autres appareils."));
  const ta=el("textarea",{style:"min-height:200px;font-family:var(--mono);font-size:12px",placeholder:'{ "dossiers": [ … ], "tasks": [ … ] }'});

  m.append(b);openModal();ta.focus();

function importMerge(payload){
  const sups=payload.suppliers||[];
  const doss=payload.dossiers||(Array.isArray(payload)?payload:[]);
  const idmap={};
  sups.forEach(s=>{
    const ex=DB.suppliers.find(x=>(x.name||"").trim().toLowerCase()===(s.name||"").trim().toLowerCase());
    if(ex){idmap[s.id]=ex.id;
      // compléter les champs vides sans écraser les saisies, et promouvoir un statut encore "Prospect"
      ["country","category","contact","email","phone","website","notes"].forEach(k=>{if((ex[k]==null||ex[k]==="")&&s[k])ex[k]=s[k];});
      if(ex.status==="Prospect"&&s.status&&s.status!=="Prospect")ex.status=s.status;
    }
    else{const ns=Object.assign({status:"Prospect",rating:0,notes:"",createdDate:todayISO()},s);const old=ns.id;ns.id=uid();DB.suppliers.unshift(ns);idmap[old]=ns.id;}
  });
  let added=0,updated=0;
  doss.forEach(d=>{
    const inc=JSON.parse(JSON.stringify(d));
    if(inc.selectedSupplierId&&idmap[inc.selectedSupplierId])inc.selectedSupplierId=idmap[inc.selectedSupplierId];
    (inc.offers||[]).forEach(o=>{if(o.supplierId&&idmap[o.supplierId])o.supplierId=idmap[o.supplierId];});
    const existing=inc.ref?DB.dossiers.find(x=>(x.ref||"")===inc.ref):null;
    if(existing){
      const incOffers=inc.offers;delete inc.offers;
      const incDocs=inc.docs;delete inc.docs;
      Object.keys(inc).forEach(k=>{if(k!=="id")existing[k]=inc[k];});
      if(incOffers){existing.offers=existing.offers||[];incOffers.forEach(o=>{const ex=existing.offers.find(e=>e.supplierId===o.supplierId);if(ex){Object.keys(o).forEach(k=>{if(k!=="id")ex[k]=o[k];});}else{o.id=uid();existing.offers.push(o);}});}
      // fusion des pièces par id (ou type+intitulé) en PRÉSERVANT les fichiers déjà joints sur l'appareil
      if(incDocs){existing.docs=existing.docs||[];incDocs.forEach(nd=>{
        const ex=existing.docs.find(e=>(nd.id&&e.id===nd.id)||((e.type||"")===(nd.type||"")&&(e.name||"")===(nd.name||"")));
        if(ex){const keep={fileId:ex.fileId,fileName:ex.fileName,fileType:ex.fileType,fileSize:ex.fileSize,storagePath:ex.storagePath};Object.keys(nd).forEach(k=>{if(k!=="id")ex[k]=nd[k];});["fileId","fileName","fileType","fileSize","storagePath"].forEach(k=>{if(nd[k]==null&&keep[k]!=null)ex[k]=keep[k];});}
        else{nd.id=nd.id||uid();existing.docs.push(nd);}
      });}
      updated++;
    }else{
      inc.id=uid();(inc.offers||[]).forEach(o=>o.id=uid());(inc.docs||[]).forEach(dc=>{dc.id=dc.id||uid();});DB.dossiers.unshift(inc);added++;
    }
  });
  let addedTasks=0;
  const tks=payload.tasks||(payload.meta&&payload.meta.tasks);
  if(Array.isArray(tks)){const list=getTasks();tks.forEach(tk=>{const nt=Object.assign({id:uid(),status:"À faire",priority:"Normale",due:"",note:"",dossierRef:"",entity:"",created:todayISO()},tk);nt.id=uid();if(nt.dossierRef){const d=DB.dossiers.find(x=>x.ref===nt.dossierRef);nt.entity=d?dossEntity(d):(nt.entity||"");}list.unshift(nt);addedTasks++;});}
  save();render();buildNav();
  toast((added?added+" dossier(s) ajouté(s). ":"")+(updated?updated+" mis à jour. ":"")+(addedTasks?addedTasks+" tâche(s) ajoutée(s).":"")||"Rien à importer");
}

function tableData(which){
  if(which==="suppliers")return{name:"Fournisseurs",head:["Nom","Pays","Catégorie","Contact","Email","Téléphone","Site","Statut","Évaluation","Notes"],
    rows:DB.suppliers.map(s=>[s.name,s.country,s.category,s.contact,s.email,s.phone,s.website,s.status,s.rating,s.notes])};
  if(which==="payments")return{name:"Paiements-LC",head:["Réf","Fournisseur","Modalité","Acompte %","Montant acompte","Instrument acompte","Date acompte","Reliquat","Instrument reliquat","Date reliquat","Réf. paiement","Terme LC (j)","N° LC","Date émission LC","Montant LC","Expiration LC","Devise"],
    rows:DB.dossiers.map(d=>[d.ref,supName(d.selectedSupplierId),d.paymentTerm,d.depositPct,d.depositAmount,d.depositInstrument,d.depositDate,d.balanceAmount,d.balanceInstrument,d.balanceDate,d.paymentRef,d.lcTenorDays,d.lcNumber,d.lcOpeningDate,d.lcAmount,d.lcExpiryDate,d.currency])};
  if(which==="ship")return{name:"Expeditions",head:["Réf","Objet","Limite exp. (LC)","Booking","Conteneurs","Transporteur","Navire","ETD","ETA","POD","Statut","Tracking"],
    rows:DB.dossiers.map(d=>[d.ref,d.title,d.latestShipDate,d.bookingNo,d.containers,d.carrier,d.vessel,d.etd,d.eta,d.pod,d.shipStatus,d.trackingUrl])};
  return{name:"Dossiers",head:["Réf","Société","Objet","AO","Marché","Réf marché","Catégorie","Étape","Statut","Date clôture","Motif","Fournisseur retenu","Valeur","Devise","Incoterm","Priorité","RFQ envoyé","Échéance","Pièces","Notes"],
    rows:DB.dossiers.map(d=>[d.ref,dossEntity(d),d.title,((d.isTender!==undefined?d.isTender:!!d.marketRef)?"Oui":"Non"),(d.isMarket?"Oui":"Non"),d.marketRef,d.category,d.stage,getState(d),d.closedDate,d.closedReason,supName(d.selectedSupplierId),d.estValue,d.currency,d.incoterm,d.priority,d.rfqSentDate,d.rfqDueDate,(d.docs||[]).map(x=>x.type+":"+x.name).join(" | "),d.notes])};
}
function exportCSV(which){const t=tableData(which);const esc2=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';const lines=[t.head.map(esc2).join(";")];t.rows.forEach(r=>lines.push(r.map(esc2).join(";")));download("﻿"+lines.join("\r\n"),`${t.name}-${todayISO()}.csv`,"text/csv");toast("CSV exporté");}
function exportTable(which){const t=tableData(which);let h=`<table border="1"><thead><tr>${t.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>`;t.rows.forEach(r=>{h+="<tr>"+r.map(x=>`<td>${esc(x)}</td>`).join("")+"</tr>";});h+="</tbody></table>";const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>${h}</body></html>`;download(html,`${t.name}-${todayISO()}.xls`,"application/vnd.ms-excel");toast("Excel exporté");}
function download(content,filename,type){try{const blob=new Blob([content],{type:type+";charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},100);}catch(e){toast("⚠ Export impossible dans ce contexte");}}
function printView(){window.print();}

function openModal(){$("#scrim").classList.add("on");}
function closeModal(){$("#scrim").classList.remove("on");}

function confirmInline(msg){return window.confirm?window.confirm(msg):true;}
function confirmBox(msg,onYes,okLabel){
  const ov=el("div",{style:"position:fixed;inset:0;background:rgba(10,20,19,.5);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px"});
  const card=el("div",{class:"card pad",style:"max-width:420px;width:100%;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.35)"});
  card.append(el("p",{style:"margin:0 0 16px;font-size:14px;line-height:1.5"},msg));
  const bar=el("div",{style:"display:flex;gap:8px;justify-content:flex-end"});
  bar.append(el("button",{class:"btn",onclick:()=>ov.remove()},"Annuler"));
  const ok=el("button",{class:"btn pri",style:"background:var(--crit);border-color:var(--crit)",onclick:()=>{ov.remove();onYes();}},okLabel||"Supprimer");
  bar.append(ok);card.append(bar);ov.append(card);document.body.append(ov);
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
  ok.focus();
}
